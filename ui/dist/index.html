    <title>grove</title>
    <script>
      // Pre-paint theme stamp — same key as src/lib/theme.ts, so the page
      // never flashes the wrong palette before React takes over.
      ;(function () {
        var pref = localStorage.getItem('grove_theme')
        if (pref !== 'light' && pref !== 'dark')
          pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = pref
      })()
    </script>
